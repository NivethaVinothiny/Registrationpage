<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Canvas Diaries</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Canvas Diaries</div>
    <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Toggle navigation" aria-controls="navLinks" aria-expanded="false">
      ☰
    </button>
    <ul class="nav-links" id="navLinks">
      <li class="drawer-close-item"><button class="drawer-close" id="drawerCloseBtn" type="button" aria-label="Close navigation">×</button></li>
      <li><a href="index.html">Home</a></li>
      <li><a href="register.html">Register</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <div class="grid-2 contact-section">
    <div>
      <h2>Let's Paint Together! 🖌️</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Have a wall that needs a creative touch? Get in touch with us directly for custom consultations.</p>
      <p><strong>Artist:</strong> Nivetha</p>
      <p><strong>Specialty:</strong> Wall Murals, Canvas Art, & Custom Gifts</p>
    </div>

    <div class="form-container card-reset">
      <h3>Send a Query</h3>
      
      <div class="form-group">
        <label for="contactName">Your Name</label>
        <input type="text" id="contactName" placeholder="Your Full Name">
      </div>

      <div class="form-group">
        <label for="projectDetails">Project Details</label>
        <textarea id="projectDetails" rows="4" maxlength="500" placeholder="Describe your wall dimensions or design ideas..."></textarea>
        <!-- Goodreads Style Counter Below Textarea -->
        <div class="counter-wrapper">
          <span id="charCount" class="char-badge">0 / 500</span>
        </div>
      </div>

      <button class="btn btn-full" id="submitInquiryBtn" type="button">Submit Inquiry</button>
    </div>
  </div>

  <script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');

    const setDrawerOpen = (isOpen) => {
      hamburgerBtn.setAttribute('aria-expanded', String(isOpen));
      navLinks.classList.toggle('active', isOpen);
    };

    hamburgerBtn.addEventListener('click', () => {
      setDrawerOpen(hamburgerBtn.getAttribute('aria-expanded') !== 'true');
    });

    drawerCloseBtn.addEventListener('click', () => setDrawerOpen(false));

    navLinks.addEventListener('click', (event) => {
      if (event.target.closest('a')) setDrawerOpen(false);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setDrawerOpen(false);
    });

    const textarea = document.getElementById('projectDetails');
    const charCountDisplay = document.getElementById('charCount');
    const submitInquiryBtn = document.getElementById('submitInquiryBtn');

    submitInquiryBtn.addEventListener('click', () => {
      window.location.reload();
    });

    textarea.addEventListener('input', () => {
      const currentLength = textarea.value.length;
      charCountDisplay.textContent = `${currentLength} / 500`;
      
      // Highlight in soft red when reaching limit
      if (currentLength >= 450) {
        charCountDisplay.style.color = 'var(--error)';
      } else {
        charCountDisplay.style.color = 'var(--text-muted)';
      }
    });
  </script>

</body>
</html>
