<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Canvas Diaries</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Canvas Diaries</div>
    <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Toggle navigation" aria-controls="navLinks" aria-expanded="false">
      ☰
    </button>
    <ul class="nav-links" id="navLinks">
      <li class="drawer-close-item"><button class="drawer-close" id="drawerCloseBtn" type="button" aria-label="Close navigation">×</button></li>
      <li><a href="index.html">Home</a></li>
      <li><a href="register.html" class="active">Register</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <!-- Registration Form Container -->
  <div class="form-container">
    <h2>Join Canvas Club 🎨</h2>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="nameInput">Full Name</label>
        <input type="text" id="nameInput" placeholder="Enter your full name">
        <span class="error-msg" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input type="email" id="emailInput" placeholder="name@example.com">
        <span class="error-msg" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="Minimum 6 characters">
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-full" disabled>Register Now</button>
    </form>
  </div>

  <script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');

    const setDrawerOpen = (isOpen) => {
      hamburgerBtn.setAttribute('aria-expanded', String(isOpen));
      navLinks.classList.toggle('active', isOpen);
    };

    hamburgerBtn.addEventListener('click', () => {
      setDrawerOpen(hamburgerBtn.getAttribute('aria-expanded') !== 'true');
    });

    drawerCloseBtn.addEventListener('click', () => setDrawerOpen(false));

    navLinks.addEventListener('click', (event) => {
      if (event.target.closest('a')) setDrawerOpen(false);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setDrawerOpen(false);
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
